<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompts de Vuelo IA Futuristas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Dark background */
            color: #f9fafb; /* Light text */
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px; /* Increased max-width */
            margin: 0 auto;
            padding: 24px; /* Increased padding */
            background-color: rgba(255, 255, 255, 0.05); /* Glassmorphism effect */
            border-radius: 16px; /* More rounded corners */
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25); /* Stronger shadow */
            backdrop-filter: blur(12px); /* More blur */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Thin border */
        }
        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
            text-align: center;
            /*background-image: linear-gradient(to right, #6ee7b7, #3b82f6); !* Gradient from teal to blue *!
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;*/
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3); /* Slightly more pronounced text shadow */
        }
        .collapsible-menu {
            margin-bottom: 24px; /* Increased margin */
        }
        .collapsible-header {
            display: flex; /* Use flexbox for layout */
            justify-content: space-between; /* Space between title and icon */
            align-items: center; /* Vertically center items */
            background-color: rgba(255, 255, 255, 0.08); /* Glassmorphism for header */
            color: #ffffff;
            padding: 18px; /* Increased padding */
            border-radius: 12px; /* More rounded corners */
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1); /* Thin border */
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; /* Smooth transition */
            font-size: 20px; /* Larger font size */
            font-weight: 600; /* Semi-bold font */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); /* More pronounced shadow */
        }
        .collapsible-header:hover {
            background-color: rgba(255, 255, 255, 0.15); /* Lighter hover effect */
            border-color: rgba(255, 255, 255, 0.2); /* Slightly brighter border */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2); /* Increased shadow on hover */
            transform: translateY(-2px) scale(1.02); /* Slight lift and scale */
        }
        .collapsible-header::after {
            content: '+'; /* Plus icon */
            font-size: 24px; /* Larger icon */
            color: #ffffff;
            transition: transform 0.3s ease; /* Smooth transition for rotation */
            font-weight: 600; /* Make the plus bolder */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3); /* Add a subtle shadow to the icon */
        }
        .collapsible-header.active::after {
            transform: rotate(45deg); /* Rotate plus icon to X when active */
        }
        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, padding 0.5s ease; /* Smooth transition */
            background-color: rgba(255, 255, 255, 0.05); /* Glassmorphism for content */
            border-radius: 12px; /* More rounded corners */
            margin-top: -12px; /* Overlap header slightly */
            border-left: 1px solid rgba(255, 255, 255, 0.1); /* тонкая обводка */
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .collapsible-content.active {
            max-height: 500px; /* Increased max-height */
            padding: 18px; /* Increased padding */
            margin-top: 0; /* Remove negative margin when active */
        }
        .prompt-item {
            padding: 18px; /* Increased padding */
            margin-bottom: 16px; /* Increased margin */
            border-radius: 12px; /* More rounded corners */
            background-color: rgba(255, 255, 255, 0.08); /* Glassmorphism for prompt items */
            border: 1px solid rgba(255, 255, 255, 0.05); /* Thin border */
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease; /* Smooth transition */
            display: flex; /* Use flexbox for layout */
            justify-content: space-between; /* Space between text and copy button */
            align-items: center; /* Vertically center items */
        }
        .prompt-item:hover {
            background-color: rgba(255, 255, 255, 0.15); /* Lighter hover effect */
            transform: translateY(-2px) scale(1.01); /* Slight lift and scale on hover */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Add a subtle shadow */
        }
        .prompt-text {
            font-size: 18px; /* Larger font size */
            color: #ffffff;
            margin-right: 16px; /* Increased margin */
            flex: 1; /* Allow text to take up available space */
            word-wrap: break-word; /* Ensure long prompts don't overflow */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3); /* Subtle text shadow */
        }

    </style>
</head>
<body class="bg-gray-900 text-gray-50">
    <div class="container">
        <div id="collapsible-list">
            </div>
        <h2 class="title mt-8 text-center">Usar estos prompts en el simulador o en una AI tool real</h2>
    </div>
    <script>
        const promptData = [
            [
                { prompt: "Initiate pre-flight sequence." },
                { prompt: "Optimize flight path for minimal turbulence." },
                { prompt: "Calibrate neural interface with flight systems." },
                { prompt: "Diagnose potential engine anomalies." },
                { prompt: "Establish secure comms with air traffic control." },
                { prompt: "Deploy anti-grav stabilizers." },
                { prompt: "Analyze weather patterns for optimal flight conditions." },
                { prompt: "Activate emergency protocols." },
                { prompt: "Monitor passenger vitals." },
                { prompt: "Prepare for quantum jump." },
            ],
            [
                { prompt: "Predict arrival time with 99% accuracy." },
                { prompt: "Generate holographic flight map." },
                { prompt: "Translate pilot commands into binary code." },
                { prompt: "Authenticate pilot identity via retinal scan." },
                { prompt: "Engage cloaking device." },
                { prompt: "Calculate fuel consumption rate." },
                { prompt: "Optimize cabin pressure." },
                { prompt: "Run diagnostics on life support systems." },
                { prompt: "Prepare landing gear for touchdown." },
                { prompt: "Initiate post-flight shutdown sequence." },
            ],
            [
                { prompt: "Scan for unauthorized drones in airspace." },
                { prompt: "Deploy countermeasures against cyberattacks." },
                { prompt: "Analyze pilot stress levels." },
                { prompt: "Predict potential mechanical failures." },
                { prompt: "Optimize energy distribution throughout aircraft." },
                { prompt: "Generate alternative flight routes in case of emergency." },
                { prompt: "Monitor structural integrity of aircraft." },
                { prompt: "Prepare for unexpected spatial anomalies." },
                { prompt: "Initiate passenger evacuation procedures." },
                { prompt: "Transmit black box data to central server." },
            ],
        ];

        const collapsibleList = document.getElementById('collapsible-list');

        promptData.forEach((group, index) => {
            const collapsibleMenu = document.createElement('div');
            collapsibleMenu.className = 'collapsible-menu';

            const header = document.createElement('div');
            header.className = 'collapsible-header';
            header.textContent = `Vuelo IA Prompts ${index + 1}`;
            header.addEventListener('click', () => {
                header.classList.toggle('active');
                content.classList.toggle('active');
            });

            const content = document.createElement('div');
            content.className = 'collapsible-content';

            group.forEach(item => {
                const promptItem = document.createElement('div');
                promptItem.className = 'prompt-item';

                const promptTextSpan = document.createElement('span');
                promptTextSpan.className = 'prompt-text';
                promptTextSpan.textContent = item.prompt;


                promptItem.appendChild(promptTextSpan);
                content.appendChild(promptItem);
            });

            collapsibleMenu.appendChild(header);
            collapsibleMenu.appendChild(content);
            collapsibleList.appendChild(collapsibleMenu);
        });
    </script>
</body>
</html>
