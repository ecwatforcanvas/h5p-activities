<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTrip Planner | "Be Going To" + AI</title>
    <style>
        body {
            background-color: #0a0a12;
            color: #00f7ff;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #ff00aa;
            padding: 20px;
            box-shadow: 0 0 20px #ff00aa80, 
                        inset 0 0 10px #00f7ff80;
            position: relative;
            background: linear-gradient(135deg, #121225 0%, #1e1e3a 100%);
        }
        h1 {
            text-shadow: 0 0 10px #00f7ff;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 10px;
            background: #1e1e3a;
            margin: 20px 0;
            border: 1px solid #00f7ff;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff00aa, #00f7ff);
            transition: width 0.5s;
            box-shadow: 0 0 10px #00f7ff80;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                        transparent, 
                        rgba(255, 255, 255, 0.2), 
                        transparent);
            animation: shine 2s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        button {
            background: #ff00aa;
            color: #0a0a12;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00f7ff;
            box-shadow: 0 0 15px #00f7ff;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed #00f7ff;
            text-align: left;
            background: rgba(10, 10, 30, 0.7);
            display: none;
        }
        .prompt-box {
            color: #ff00aa;
            font-weight: bold;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            background: #121225;
            border: 1px solid #00f7ff;
            color: white;
            padding: 10px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
        }
        .copy-btn {
            background: #00f7ff;
            color: #0a0a12;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ CYBER TRIP PLANNER ⚡</h1>
        <p>Complete the sentences with <strong>"be going to"</strong> to plan your transport:</p>
        
        <div id="question-container">
            <p id="question">Loading...</p>
            <input type="text" id="answer" placeholder="Type your answer...">
            <button onclick="checkAnswer()">Submit</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="result" id="result">
            <div class="prompt-box">
                📡 <strong>Prompt to ask ChatGPT:</strong>
                <p id="ai-prompt"></p>
                <button onclick="copyPrompt()" class="copy-btn">Copy Prompt</button>
            </div>
            <div>
                ✨ <strong>Paste ChatGPT's Answer Here:</strong>
                <textarea id="ai-answer" placeholder="Paste AI's response after asking ChatGPT..."></textarea>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "I ___ take the train to Neo-Tokyo tomorrow.", a: "am going to" },
            { q: "She ___ book a flight to CyberCity tonight.", a: "is going to" },
            { q: "They ___ rent a hover-car for the trip.", a: "are going to" },
            { q: "We ___ use the metro to avoid traffic.", a: "are going to" },
            { q: "He ___ check the departure boards for delays.", a: "is going to" }
        ];
        
        let currentQuestion = 0;
        
        function updateQuestion() {
            if (currentQuestion < questions.length) {
                document.getElementById("question").textContent = questions[currentQuestion].q;
                document.getElementById("answer").value = "";
            } else {
                endQuiz();
            }
        }
        
        function checkAnswer() {
            currentQuestion++;
            updateProgress();
            updateQuestion();
        }
        
        function updateProgress() {
            const progress = (currentQuestion / questions.length) * 100;
            document.getElementById("progress").style.width = `${progress}%`;
        }
        
        function endQuiz() {
            document.getElementById("question-container").style.display = "none";
            document.getElementById("result").style.display = "block";
            
            // Generate a practical AI prompt about transportation
            const prompts = [
                "Give me 5 tips for using 'be going to' when planning travel arrangements.",
                "Explain how to check flight departure boards efficiently, using future tense.",
                "List 3 common transportation problems and how to avoid them (use 'be going to' in examples)."
            ];
            
            const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
            document.getElementById("ai-prompt").textContent = randomPrompt;
        }
        
        function copyPrompt() {
            const promptText = document.getElementById("ai-prompt").textContent;
            navigator.clipboard.writeText(promptText);
            alert("Prompt copied! Ask ChatGPT now.");
        }
        
        // Initialize
        updateQuestion();
    </script>
</body>
</html>
